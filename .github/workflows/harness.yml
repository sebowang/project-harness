name: Harness validation

on:
  push:
  pull_request:

jobs:
  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check template neutrality
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests/check-template-neutrality.ps1
      - name: Run PowerShell 5.1 smoke test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests/initialize-smoke.ps1

  smoke-pwsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show PowerShell version
        run: pwsh --version
      - name: Check template neutrality
        shell: pwsh
        run: ./tests/check-template-neutrality.ps1
      - name: Run PowerShell smoke test
        shell: pwsh
        run: ./tests/initialize-smoke.ps1
