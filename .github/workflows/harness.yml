name: Harness validation

on:
  push:
  pull_request:

jobs:
  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell 5.1 smoke test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests/initialize-smoke.ps1

  smoke-pwsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell
        uses: PowerShell/PowerShell@v1
        with:
          powershell-version: '7.4.x'
      - name: Run PowerShell smoke test
        shell: pwsh
        run: ./tests/initialize-smoke.ps1
